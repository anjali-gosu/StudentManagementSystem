<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Management System</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<div class="container">

    <h1>Student Management System</h1>

    <a th:href="@{/addStudent}" class="addBtn">Add Student</a>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="student : ${students}">

                <td th:text="${student.id}"></td>

                <td th:text="${student.name}"></td>

                <td th:text="${student.email}"></td>

                <td th:text="${student.phone}"></td>

                <td th:text="${student.course}"></td>

                <td>

                    <a th:href="@{'/editStudent/' + ${student.id}}" class="editBtn">
                        Edit
                    </a>

                    <a th:href="@{'/deleteStudent/' + ${student.id}}" class="deleteBtn">
                        Delete
                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
